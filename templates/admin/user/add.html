{% extends 'admin/master.html' %}

{% block page_header %}
<div class="row align-items-center">
  <div class="col-sm-6">
    <span class="kicker-tag">Account Creation</span>
    <h2 class="page-main-heading">Add New <em>User</em></h2>
  </div>
  <div class="col-sm-6">
    <ul class="breadcrumb-mk7 justify-content-sm-end mt-2 mt-sm-0">
      <li><a href="{{ url_for('admin_bp.dashboard') }}">Admin</a></li>
      <li class="breadcrumb-separator"><i class="bi bi-chevron-right"></i></li>
      <li><a href="{{ url_for('admin_bp.users') }}">Users</a></li>
      <li class="breadcrumb-separator"><i class="bi bi-chevron-right"></i></li>
      <li class="text-dark fw-semibold">Add</li>
    </ul>
  </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-md-10">
    <div class="card-mk7">
      <div class="card-mk7-header">
        <div>
          <span class="kicker-tag">Profile Details</span>
          <h3 class="card-mk7-title">Account <em>Information</em></h3>
        </div>
      </div>
      <!-- /.card-header -->

      <div class="card-mk7-body">
        <form id="addUserForm" method="POST" action="{{ url_for('admin_bp.user_add') }}" enctype="multipart/form-data">
          <!-- CSRF token -->
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <!-- Profile Image Picker -->
          <div class="avatar-picker-container">
            <div class="mb-2">
              <div id="noImgPreview" class="avatar-picker-placeholder mx-auto" title="Click to choose avatar">
                <i class="bi bi-camera fs-4"></i>
                <span style="font-size: 11px; font-weight: 500;">Upload Photo</span>
              </div>
              <img id="imagePreview" src="" alt="Preview"
                class="avatar-picker-preview d-none mx-auto" title="Click to change photo">
            </div>
            <input type="file" id="imageInput" name="image" class="d-none" accept="image/*">
            <button type="button" class="btn-pill-outline" id="chooseImageBtn" style="padding: 5px 16px; font-size: 12px;">
              <i class="bi bi-image"></i> Select Image
            </button>
            <div class="text-muted small mt-2" style="font-size: 11.5px;">PNG, JPG, or GIF up to 2MB (Auto-compressed to 80% thumbnail)</div>
          </div>

          <hr class="my-4" style="border-color: var(--border);">

          <!-- Name -->
          <div class="mb-4">
            <label for="userName" class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.08em; color: var(--muted);">
              Full Name
            </label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border); border-radius: var(--radius-sm) 0 0 var(--radius-sm);">
                <i class="bi bi-person text-muted"></i>
              </span>
              <input type="text" class="form-control form-control-mk7 border-start-0" id="userName" name="name"
                placeholder="e.g. Eleanor Vance" required style="border-radius: 0 var(--radius-sm) var(--radius-sm) 0 !important;">
            </div>
          </div>

          <!-- Email -->
          <div class="mb-4">
            <label for="userEmail" class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.08em; color: var(--muted);">
              Email Address
            </label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border); border-radius: var(--radius-sm) 0 0 var(--radius-sm);">
                <i class="bi bi-envelope text-muted"></i>
              </span>
              <input type="email" class="form-control form-control-mk7 border-start-0" id="userEmail" name="email"
                placeholder="name@example.com" required style="border-radius: 0 var(--radius-sm) var(--radius-sm) 0 !important;">
            </div>
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label for="userPassword" class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.08em; color: var(--muted);">
              Password
            </label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border); border-radius: var(--radius-sm) 0 0 var(--radius-sm);">
                <i class="bi bi-lock text-muted"></i>
              </span>
              <input type="password" class="form-control form-control-mk7 border-start-0" id="userPassword" name="password"
                placeholder="••••••••" required style="border-radius: 0 var(--radius-sm) var(--radius-sm) 0 !important;">
            </div>
          </div>

          <!-- Role -->
          <div class="mb-4">
            <label for="userRole" class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.08em; color: var(--muted);">
              Account Role
            </label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border); border-radius: var(--radius-sm) 0 0 var(--radius-sm);">
                <i class="bi bi-shield-lock text-muted"></i>
              </span>
              <select class="form-select form-select-mk7 border-start-0" id="userRole" name="role" required style="border-radius: 0 var(--radius-sm) var(--radius-sm) 0 !important;">
                <option value="user" selected>User (Standard shopper)</option>
                <option value="admin">Admin (Full system access)</option>
              </select>
            </div>
          </div>

          <hr class="my-4" style="border-color: var(--border);">

          <!-- Buttons -->
          <div class="d-flex align-items-center justify-content-between">
            <a href="{{ url_for('admin_bp.users') }}" class="btn-pill-outline">
              <i class="bi bi-arrow-left"></i> Back to Users
            </a>
            <div class="d-flex gap-2">
              <button type="reset" class="btn-pill-outline">
                <i class="bi bi-arrow-counterclockwise"></i> Reset
              </button>
              <button type="submit" class="btn-pill-primary">
                <i class="bi bi-check2"></i> Create Account
              </button>
            </div>
          </div>

        </form>
      </div>
      <!-- /.card-body -->
    </div>
    <!-- /.card-mk7 -->
  </div>
  <!-- /.col -->
</div>
<!-- /.row -->

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const chooseImageBtn = document.getElementById('chooseImageBtn');
    const noImgPreview = document.getElementById('noImgPreview');

    // Click the hidden file input when button, image, or placeholder is clicked
    chooseImageBtn.addEventListener('click', function () {
      imageInput.click();
    });
    imagePreview.addEventListener('click', function () {
      imageInput.click();
    });
    if (noImgPreview) {
      noImgPreview.addEventListener('click', function () {
        imageInput.click();
      });
    }

    // Preview selected image using URL.createObjectURL
    imageInput.addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (file) {
        imagePreview.src = URL.createObjectURL(file);
        imagePreview.classList.remove('d-none');
        if (noImgPreview) noImgPreview.classList.add('d-none');
        imagePreview.onload = function () {
          URL.revokeObjectURL(imagePreview.src); // free memory
        };
      }
    });

    // Reset image preview when form is reset
    document.getElementById('addUserForm').addEventListener('reset', function () {
      setTimeout(function () {
        imagePreview.src = '';
        imagePreview.classList.add('d-none');
        if (noImgPreview) noImgPreview.classList.remove('d-none');
      }, 0);
    });
  });
</script>
{% endblock %}

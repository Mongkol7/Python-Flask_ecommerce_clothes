<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Flask Store{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='2') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('front_bp.home') }}">Flask Store</a>
      <nav class="site-nav">
        <a href="{{ url_for('front_bp.home') }}">Home</a>
        <a href="{{ url_for('front_bp.cart') }}">Cart</a>
      </nav>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
